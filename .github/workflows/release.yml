name: Publicar Orbit Desktop

on:
  push:
    branches: [main]
    paths:
      - package.json
      - src/**
      - RELEASE_NOTES.md
      - .github/workflows/release.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Baixar o projeto
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependências
        run: npm install

      - name: Gerar instalador x64
        run: npm run dist -- --publish never

      - name: Preparar arquivos da atualização
        shell: powershell
        run: |
          New-Item -ItemType Directory -Path release -Force | Out-Null
          Copy-Item -LiteralPath "dist/Orbit Setup.exe" -Destination "release/Orbit-Setup.exe"
          Copy-Item -LiteralPath "dist/Orbit Setup.exe.blockmap" -Destination "release/Orbit-Setup.exe.blockmap"
          Copy-Item -LiteralPath "dist/latest.yml" -Destination "release/latest.yml"
          Compress-Archive -Path src,package.json,README.md -DestinationPath "release/Orbit-Desktop-Source.zip" -Force

      - name: Publicar atualização
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = node -p "require('./package.json').version"
          $tag = "v$version"
          $existing = gh release list --limit 100 --json tagName --jq ".[] | select(.tagName == `"$tag`") | .tagName"
          if ($existing) {
            gh release upload $tag release/* --clobber
          } else {
            gh release create $tag release/* --title "Orbit Desktop $version" --notes-file RELEASE_NOTES.md --target "${{ github.sha }}" --latest
          }
